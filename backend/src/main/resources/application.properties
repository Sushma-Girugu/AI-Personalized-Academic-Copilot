spring.application.name=academic-copilot


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/academic_copilot}
spring.datasource.username=${DATABASE_USERNAME:academic_user}
spring.datasource.password=${DATABASE_PASSWORD:academic_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# GEMINI
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.5-flash-lite


# =========================================================
# QDRANT CLOUD
# =========================================================

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.collection-name=academic_materials_v2
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}


# =========================================================
# SESSION COOKIE
# =========================================================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
